/*
 * LilyGO TTGO T-Display (ESP32) — Полевой сетевой тулкит v2
 * ---------------------------------------------------------
 * Экраны:
 *   1) WiFi Scanner   — сети, отсортированные по RSSI, канал, шифрование
 *   2) Ping Monitor   — TCP-пинг, смена цели кнопкой, график + статистика
 *   3) Network Info   — IP, маска, шлюз, DNS, MAC, RSSI
 *   4) Host Scanner   — ping-sweep подсети /24
 *   5) RSSI Walk      — живой график RSSI (поиск мёртвых зон)
 *   6) Chan Analyzer  — загруженность каналов 1-13 (гистограмма)
 *   7) Port Scanner   — скан популярных портов на шлюзе
 *   + Индикатор батареи на всех экранах
 *
 * Управление:
 *   BTN1 (GPIO0, верхняя)  — переключение/обновить/следующая цель
 *   BTN2 (GPIO35, нижняя)  — выбор/назад в меню
 *
 * Библиотеки: TFT_eSPI (пресет Setup25_TTGO_T_Display.h), WiFi (встроена)
 */

#include <TFT_eSPI.h>
#include <WiFi.h>

// ---------- Настройки ----------
const char* WIFI_SSID     = "namenetwork";
const char* WIFI_PASSWORD = "твой_реальный_пароль";  // <-- ВПИШИ ПАРОЛЬ

const uint16_t PING_TIMEOUT_MS = 500;
const uint16_t SCAN_TIMEOUT_MS = 150;

#define BTN1 0
#define BTN2 35
#define BATTERY_PIN 34
#define TFT_BL_PIN 4

TFT_eSPI tft = TFT_eSPI();

enum Screen { MENU, WIFI_SCAN, PING_MONITOR, NET_INFO, HOST_SCAN, RSSI_WALK, CHAN_ANALYZER, PORT_SCAN };
Screen currentScreen = MENU;
int menuIndex = 0;
const char* menuItems[] = {"WiFi Scanner", "Ping Monitor", "Network Info", "Host Scanner",
                           "RSSI Walk", "Chan Analyzer", "Port Scan"};
const int menuCount = 7;

// ---------- Пресеты пинга (BTN1 листает по кругу) ----------
struct PingPreset { const char* name; const char* target; uint16_t port; };
PingPreset pingPresets[] = {
  {"Google DNS ", "8.8.8.8",  443},
  {"Cloudflare ", "1.1.1.1",  443},
  {"Gateway    ", "",         80 },   // "" = использовать шлюз
};
const int pingPresetCount = 3;
int pingPresetIndex = 0;

// Ping monitor state
uint32_t pingHistory[20];
int pingHistCount = 0;
unsigned long lastPingTime = 0;
const unsigned long pingInterval = 1000;
// статистика
uint32_t statMin = 0, statMax = 0, statSum = 0; int statCount = 0, statLoss = 0;

// RSSI walk state
int rssiHistory[20];
int rssiHistCount = 0;
unsigned long lastRssiTime = 0;
const unsigned long rssiInterval = 300;

// Host scanner state
bool hostScanRunning = false;
int hostScanProgress = 0;
int hostsFound = 0;
IPAddress hostScanBase;

// WiFi scan state
bool wifiScanRunning = false;
unsigned long wifiScanStart = 0;

// Port scan state
const uint16_t scanPorts[] = {21, 22, 23, 25, 53, 80, 110, 143, 443, 445, 993, 995, 1433, 3306, 3389, 5900, 8080, 8443};
const int scanPortCount = sizeof(scanPorts) / sizeof(scanPorts[0]);
int portScanIndex = 0;
bool portScanRunning = false;
int portsOpen[20]; int portsOpenCount = 0;

// Переподключение к WiFi
unsigned long lastReconnectAttempt = 0;
const unsigned long reconnectInterval = 5000;

// Debounce
unsigned long lastBtnTime = 0;
const unsigned long debounceMs = 200;

// ================= SETUP =================
void setup() {
  Serial.begin(115200);
  pinMode(BTN1, INPUT_PULLUP);
  pinMode(BTN2, INPUT_PULLUP);

  pinMode(TFT_BL_PIN, OUTPUT);
  digitalWrite(TFT_BL_PIN, HIGH);

  tft.init();
  tft.setRotation(1);
  tft.fillScreen(TFT_BLACK);
  tft.setTextColor(TFT_WHITE, TFT_BLACK);

  drawSplash();

  WiFi.mode(WIFI_STA);
  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);

  Serial.println();
  Serial.print("Connecting to: ");
  Serial.println(WIFI_SSID);
  Serial.println("Status: 3=OK 1=SSID not found 4=wrong password 6=disconnected");

  int tries = 0;
  while (WiFi.status() != WL_CONNECTED && tries < 20) {
    delay(500);
    Serial.print(WiFi.status());
    tries++;
  }
  Serial.println();
  if (WiFi.status() == WL_CONNECTED) {
    Serial.print("Connected! IP: ");
    Serial.println(WiFi.localIP());
  } else {
    Serial.print("FAILED. status=");
    Serial.println(WiFi.status());
  }

  delay(1500);
  drawMenu();
}

// ================= LOOP =================
void loop() {
  bool b1 = digitalRead(BTN1) == LOW;
  bool b2 = digitalRead(BTN2) == LOW;
  unsigned long now = millis();

  if ((b1 || b2) && (now - lastBtnTime > debounceMs)) {
    lastBtnTime = now;
    handleButtons(b1, b2);
  }

  if (currentScreen == PING_MONITOR && now - lastPingTime > pingInterval) {
    lastPingTime = now;
    doPingUpdate();
  }

  if (currentScreen == RSSI_WALK && now - lastRssiTime > rssiInterval) {
    lastRssiTime = now;
    doRssiUpdate();
  }

  if (currentScreen == HOST_SCAN && hostScanRunning) {
    doHostScanStep();
  }

  if (currentScreen == WIFI_SCAN && wifiScanRunning) {
    int res = WiFi.scanComplete();
    if (res >= 0) drawWifiResults(res);
    else if (res == WIFI_SCAN_FAILED && millis() - wifiScanStart > 10000) {
      wifiScanRunning = false;
      tft.setCursor(5, 18);
      tft.setTextColor(TFT_RED, TFT_BLACK);
      tft.println("Scan failed");
      tft.setTextColor(TFT_WHITE, TFT_BLACK);
    }
  }

  if (currentScreen == CHAN_ANALYZER && wifiScanRunning) {
    int res = WiFi.scanComplete();
    if (res >= 0) drawChannelAnalyzer(res);
    else if (res == WIFI_SCAN_FAILED && millis() - wifiScanStart > 10000) {
      wifiScanRunning = false;
      tft.setCursor(5, 18);
      tft.setTextColor(TFT_RED, TFT_BLACK);
      tft.println("Scan failed");
      tft.setTextColor(TFT_WHITE, TFT_BLACK);
    }
  }

  if (currentScreen == PORT_SCAN && portScanRunning) {
    doPortScanStep();
  }

  // Автопереподключение к WiFi (кроме активного скана)
  if (WiFi.status() != WL_CONNECTED && currentScreen != WIFI_SCAN &&
      currentScreen != CHAN_ANALYZER &&
      now - lastReconnectAttempt > reconnectInterval) {
    lastReconnectAttempt = now;
    WiFi.disconnect(false, true);
    delay(50);
    WiFi.begin(WIFI_SSID, WIFI_PASSWORD);
  }
}

// ================= Навигация =================
void handleButtons(bool b1, bool b2) {
  if (currentScreen == MENU) {
    if (b1) {
      menuIndex = (menuIndex + 1) % menuCount;
      drawMenu();
    } else if (b2) {
      enterScreen((Screen)(menuIndex + 1));
    }
    return;
  }

  switch (currentScreen) {
    case WIFI_SCAN:
      if (b1) startWifiScan();
      if (b2) backToMenu();
      break;

    case PING_MONITOR:
      if (b1) { // следующая цель, сброс статистики
        pingPresetIndex = (pingPresetIndex + 1) % pingPresetCount;
        pingHistCount = 0; statMin = statMax = statSum = 0;
        statCount = 0; statLoss = 0; lastPingTime = 0;
        drawPingScreen();
      }
      if (b2) { pingHistCount = 0; backToMenu(); }
      break;

    case NET_INFO:
      if (b2) backToMenu();
      if (b1) drawNetInfo();
      break;

    case HOST_SCAN:
      if (b2) { hostScanRunning = false; backToMenu(); }
      if (b1 && !hostScanRunning) startHostScan();
      break;

    case RSSI_WALK:
      if (b2) { rssiHistCount = 0; backToMenu(); }
      break;

    case CHAN_ANALYZER:
      if (b1 && !wifiScanRunning) startChanScan();
      if (b2) { wifiScanRunning = false; backToMenu(); }
      break;

    case PORT_SCAN:
      if (b2) { portScanRunning = false; backToMenu(); }
      if (b1 && !portScanRunning) startPortScan();
      break;

    default: break;
  }
}

void backToMenu() {
  currentScreen = MENU;
  drawMenu();
}

void enterScreen(Screen s) {
  currentScreen = s;
  if (s == WIFI_SCAN)     startWifiScan();
  if (s == PING_MONITOR)  { pingHistCount = 0; lastPingTime = 0; drawPingScreen(); }
  if (s == NET_INFO)      drawNetInfo();
  if (s == HOST_SCAN)     startHostScan();
  if (s == RSSI_WALK)     { rssiHistCount = 0; lastRssiTime = 0; drawRssiScreen(); }
  if (s == CHAN_ANALYZER) startChanScan();
  if (s == PORT_SCAN)     startPortScan();
}

// ================= TCP-"пинг" =================
bool tcpPing(IPAddress target, uint16_t port, uint16_t timeoutMs, uint32_t &outMs) {
  WiFiClient client;
  client.setTimeout(timeoutMs);
  unsigned long start = millis();
  bool ok = client.connect(target, port, timeoutMs);
  outMs = millis() - start;
  if (ok) client.stop();
  return ok;
}

// ================= Батарея =================
int readBatteryPercent() {
  int raw = analogRead(BATTERY_PIN);
  float voltage = (raw / 4095.0) * 3.3 * 2.0;
  int pct = (int)((voltage - 3.3) / (4.2 - 3.3) * 100.0);
  if (pct < 0) pct = 0;
  if (pct > 100) pct = 100;
  return pct;
}

void drawBatteryIcon() {
  int pct = readBatteryPercent();
  int x = 205, y = 2, w = 28, h = 12;
  uint16_t color = (pct > 50) ? TFT_GREEN : (pct > 20) ? TFT_YELLOW : TFT_RED;
  tft.drawRect(x, y, w, h, TFT_WHITE);
  tft.fillRect(x + w, y + 3, 2, h - 6, TFT_WHITE);
  tft.fillRect(x + 1, y + 1, w - 2, h - 2, TFT_BLACK);
  int fillW = (int)((w - 2) * (pct / 100.0));
  tft.fillRect(x + 1, y + 1, fillW, h - 2, color);
}

// ================= Экраны =================
void drawSplash() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(2);
  tft.setCursor(10, 40);
  tft.println("Network Toolkit");
  tft.setTextSize(1);
  tft.setCursor(10, 70);
  tft.println("TTGO T-Display v2");
}

void drawMenu() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(2);
  tft.setCursor(5, 5);
  tft.println("MENU");
  tft.setTextSize(1);
  drawBatteryIcon();
  tft.drawLine(0, 25, 240, 25, TFT_DARKGREY);

  for (int i = 0; i < menuCount; i++) {
    int y = 30 + i * 13;
    if (i == menuIndex) {
      tft.fillRect(0, y - 2, 240, 13, TFT_BLUE);
      tft.setTextColor(TFT_WHITE, TFT_BLUE);
    } else {
      tft.setTextColor(TFT_WHITE, TFT_BLACK);
    }
    tft.setCursor(10, y);
    tft.println(menuItems[i]);
  }
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.setCursor(5, 122);
  tft.println("BTN1: next  BTN2: select");
}

// ================= WiFi Scanner (сортировка по RSSI + канал) =================
void startWifiScan() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 5);
  tft.println("Scanning WiFi...");
  drawBatteryIcon();

  WiFi.scanDelete();
  WiFi.disconnect(false, true);
  delay(100);
  WiFi.scanNetworks(true, false);
  wifiScanRunning = true;
  wifiScanStart = millis();
}

void drawWifiResults(int n) {
  wifiScanRunning = false;

  // сортируем индексы по RSSI (сильные сверху)
  int idx[20];
  int count = min(n, 20);
  for (int i = 0; i < count; i++) idx[i] = i;
  for (int i = 0; i < count - 1; i++)
    for (int j = 0; j < count - 1 - i; j++)
      if (WiFi.RSSI(idx[j]) < WiFi.RSSI(idx[j + 1])) {
        int t = idx[j]; idx[j] = idx[j + 1]; idx[j + 1] = t;
      }

  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  tft.printf("WiFi Scan (%d found)", n);
  drawBatteryIcon();
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);

  int maxShow = min(count, 7);
  for (int i = 0; i < maxShow; i++) {
    int k = idx[i];
    int y = 16 + i * 13;
    String ssid = WiFi.SSID(k);
    if (ssid.length() == 0) ssid = "(hidden)";
    if (ssid.length() > 11) ssid = ssid.substring(0, 11);
    int rssi = WiFi.RSSI(k);
    int ch = WiFi.channel(k);
    bool open = (WiFi.encryptionType(k) == WIFI_AUTH_OPEN);

    tft.setTextColor(open ? TFT_RED : TFT_GREEN, TFT_BLACK);
    tft.setCursor(0, y);
    tft.print(ssid);
    tft.setCursor(118, y);
    tft.printf("ch%-2d", ch);
    tft.setCursor(150, y);
    tft.printf("%4ddBm", rssi);
    tft.setCursor(205, y);
    tft.print(open ? "OPEN" : "ENC");
  }
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.setCursor(5, 115);
  tft.println("BTN1: rescan  BTN2: menu");

  WiFi.scanDelete();
}

// ================= Ping Monitor (смена цели + статистика) =================
void drawPingScreen() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  PingPreset &p = pingPresets[pingPresetIndex];
  if (p.target[0] == '\0') {
    tft.printf("Ping: GW %s:%d", WiFi.gatewayIP().toString().c_str(), p.port);
  } else {
    tft.printf("Ping: %s %s:%d", p.name, p.target, p.port);
  }
  drawBatteryIcon();
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);
  tft.setCursor(5, 115);
  tft.println("BTN1: target  BTN2: menu");
}

void doPingUpdate() {
  if (WiFi.status() != WL_CONNECTED) {
    tft.fillRect(0, 15, 240, 20, TFT_BLACK);
    tft.setCursor(5, 18);
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.println("WiFi not connected");
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    return;
  }

  PingPreset &p = pingPresets[pingPresetIndex];
  IPAddress targetIP;
  bool resolved;
  if (p.target[0] == '\0') {
    targetIP = WiFi.gatewayIP(); // шлюз
    resolved = targetIP != IPAddress(0, 0, 0, 0);
  } else {
    resolved = targetIP.fromString(p.target);
  }

  uint32_t ms = 0;
  bool success = false;
  if (resolved) success = tcpPing(targetIP, p.port, PING_TIMEOUT_MS, ms);

  // история
  if (pingHistCount < 20) {
    pingHistory[pingHistCount++] = success ? ms : 0;
  } else {
    for (int i = 0; i < 19; i++) pingHistory[i] = pingHistory[i + 1];
    pingHistory[19] = success ? ms : 0;
  }

  // статистика
  if (success) {
    if (statCount == 0 || ms < statMin) statMin = ms;
    if (statCount == 0 || ms > statMax) statMax = ms;
    statSum += ms;
    statCount++;
  } else {
    statLoss++;
  }

  // статус
  tft.fillRect(0, 15, 240, 20, TFT_BLACK);
  tft.setCursor(5, 18);
  if (success) {
    tft.setTextColor(TFT_GREEN, TFT_BLACK);
    tft.printf("Reply: %lu ms", ms);
  } else {
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.print("Timeout");
  }
  tft.setTextColor(TFT_WHITE, TFT_BLACK);

  drawPingGraph();

  // строка статистики
  tft.fillRect(0, 105, 240, 10, TFT_BLACK);
  tft.setCursor(5, 105);
  if (statCount > 0) {
    tft.printf("min:%lu avg:%lu max:%lu  loss:%d",
               (unsigned long)statMin,
               (unsigned long)(statSum / statCount),
               (unsigned long)statMax,
               statLoss);
  }
}

void drawPingGraph() {
  int graphX = 0, graphY = 40, graphW = 240, graphH = 60;
  tft.fillRect(graphX, graphY, graphW, graphH, TFT_BLACK);
  tft.drawRect(graphX, graphY, graphW, graphH, TFT_DARKGREY);

  uint32_t maxVal = 1;
  for (int i = 0; i < pingHistCount; i++)
    if (pingHistory[i] > maxVal) maxVal = pingHistory[i];
  if (maxVal < 50) maxVal = 50;

  int barW = graphW / 20;
  for (int i = 0; i < pingHistCount; i++) {
    int barH = (pingHistory[i] == 0) ? 2 : map(pingHistory[i], 0, maxVal, 2, graphH - 4);
    int x = graphX + i * barW;
    uint16_t color = (pingHistory[i] == 0) ? TFT_RED :
                     (pingHistory[i] > maxVal / 2) ? TFT_YELLOW : TFT_GREEN;
    tft.fillRect(x + 1, graphY + graphH - barH - 2, barW - 2, barH, color);
  }
}

// ================= Network Info =================
void drawNetInfo() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  tft.println("Network Info");
  drawBatteryIcon();
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);

  int y = 18;
  if (WiFi.status() == WL_CONNECTED) {
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    tft.setCursor(0, y); tft.printf("SSID: %s", WiFi.SSID().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("IP:   %s", WiFi.localIP().toString().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("Mask: %s", WiFi.subnetMask().toString().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("GW:   %s", WiFi.gatewayIP().toString().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("DNS:  %s", WiFi.dnsIP().toString().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("MAC:  %s", WiFi.macAddress().c_str()); y += 13;
    tft.setCursor(0, y); tft.printf("RSSI: %d dBm", WiFi.RSSI()); y += 13;
  } else {
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.setCursor(0, y);
    tft.println("Not connected to WiFi");
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
  }

  tft.setCursor(5, 115);
  tft.println("BTN1: refresh  BTN2: menu");
}

// ================= Host Scanner =================
void startHostScan() {
  if (WiFi.status() != WL_CONNECTED) {
    tft.fillScreen(TFT_BLACK);
    tft.setTextSize(1);
    tft.setCursor(5, 5);
    drawBatteryIcon();
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.println("WiFi not connected");
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    tft.setCursor(5, 115);
    tft.println("BTN2: menu");
    return;
  }

  IPAddress localIP = WiFi.localIP();
  hostScanBase = IPAddress(localIP[0], localIP[1], localIP[2], 0);
  hostScanProgress = 1;
  hostsFound = 0;
  hostScanRunning = true;

  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  drawBatteryIcon();
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.printf("Scan %d.%d.%d.0/24 :443+80\n",
             hostScanBase[0], hostScanBase[1], hostScanBase[2]);
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);
  tft.setCursor(5, 115);
  tft.println("Scanning...  BTN2: cancel");
}

void doHostScanStep() {
  if (hostScanProgress > 254) {
    hostScanRunning = false;
    tft.fillRect(0, 100, 240, 12, TFT_BLACK);
    tft.setCursor(5, 100);
    tft.setTextColor(TFT_GREEN, TFT_BLACK);
    tft.printf("Done. %d hosts alive", hostsFound);
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    tft.setCursor(5, 115);
    tft.println("BTN1: rescan  BTN2: menu");
    return;
  }

  IPAddress target(hostScanBase[0], hostScanBase[1], hostScanBase[2], hostScanProgress);
  uint32_t ms = 0;
  // пробуем 443, потом 80 — так находит больше устройств
  bool alive = tcpPing(target, 443, SCAN_TIMEOUT_MS, ms);
  if (!alive) alive = tcpPing(target, 80, SCAN_TIMEOUT_MS, ms);

  if (alive && hostsFound < 7) {
    int y = 16 + hostsFound * 13;
    tft.setCursor(0, y);
    tft.setTextColor(TFT_GREEN, TFT_BLACK);
    tft.printf(".%-3d  alive  (%lums)", hostScanProgress, ms);
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
  }
  if (alive) hostsFound++;

  int barW = map(hostScanProgress, 0, 254, 0, 240);
  tft.fillRect(0, 96, barW, 3, TFT_BLUE);

  hostScanProgress++;
}

// ================= RSSI Walk =================
void drawRssiScreen() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  tft.println("RSSI Walk");
  drawBatteryIcon();
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);
  tft.setCursor(5, 115);
  tft.println("BTN2: menu");
}

void doRssiUpdate() {
  if (WiFi.status() != WL_CONNECTED) {
    tft.fillRect(0, 15, 240, 20, TFT_BLACK);
    tft.setCursor(5, 18);
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.println("WiFi not connected");
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    return;
  }

  int rssi = WiFi.RSSI();

  if (rssiHistCount < 20) {
    rssiHistory[rssiHistCount++] = rssi;
  } else {
    for (int i = 0; i < 19; i++) rssiHistory[i] = rssiHistory[i + 1];
    rssiHistory[19] = rssi;
  }

  tft.fillRect(0, 15, 240, 20, TFT_BLACK);
  tft.setCursor(5, 18);
  const char* quality = (rssi > -60) ? "Excellent" :
                        (rssi > -70) ? "Good" :
                        (rssi > -80) ? "Weak" : "Dead zone";
  uint16_t qcolor = (rssi > -60) ? TFT_GREEN :
                    (rssi > -70) ? TFT_GREEN :
                    (rssi > -80) ? TFT_YELLOW : TFT_RED;
  tft.setTextColor(qcolor, TFT_BLACK);
  tft.printf("%d dBm - %s", rssi, quality);
  tft.setTextColor(TFT_WHITE, TFT_BLACK);

  drawRssiGraph();
}

void drawRssiGraph() {
  int graphX = 0, graphY = 40, graphW = 240, graphH = 65;
  tft.fillRect(graphX, graphY, graphW, graphH, TFT_BLACK);
  tft.drawRect(graphX, graphY, graphW, graphH, TFT_DARKGREY);

  int barW = graphW / 20;
  for (int i = 0; i < rssiHistCount; i++) {
    int rssi = rssiHistory[i];
    int barH = map(constrain(rssi, -100, -30), -100, -30, 2, graphH - 4);
    int x = graphX + i * barW;
    uint16_t color = (rssi > -60) ? TFT_GREEN :
                     (rssi > -80) ? TFT_YELLOW : TFT_RED;
    tft.fillRect(x + 1, graphY + graphH - barH - 2, barW - 2, barH, color);
  }
}

// ================= Channel Analyzer =================
void startChanScan() {
  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 5);
  tft.println("Channel Analyzer");
  tft.setCursor(5, 15);
  tft.println("Scanning...");
  drawBatteryIcon();

  WiFi.scanDelete();
  WiFi.disconnect(false, true);
  delay(100);
  WiFi.scanNetworks(true, false);
  wifiScanRunning = true;
  wifiScanStart = millis();
}

void drawChannelAnalyzer(int n) {
  wifiScanRunning = false;

  int chanCount[14] = {0}; // каналы 1-13
  int bestChan = 1;
  for (int i = 0; i < n; i++) {
    int ch = WiFi.channel(i);
    if (ch >= 1 && ch <= 13) chanCount[ch]++;
  }
  // самый свободный канал (с учётом перекрытия соседних)
  long bestScore = 999999;
  for (int ch = 1; ch <= 13; ch++) {
    long score = 0;
    for (int d = -2; d <= 2; d++) {
      int c = ch + d;
      if (c >= 1 && c <= 13) score += chanCount[c] * (3 - abs(d));
    }
    if (score < bestScore) { bestScore = score; bestChan = ch; }
  }

  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  tft.printf("Channels (%d APs)", n);
  drawBatteryIcon();
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);

  // гистограмма каналов 1-13
  int maxC = 1;
  for (int ch = 1; ch <= 13; ch++) if (chanCount[ch] > maxC) maxC = chanCount[ch];

  int graphY = 20, graphH = 70;
  int colW = 240 / 13;
  for (int ch = 1; ch <= 13; ch++) {
    int barH = (chanCount[ch] == 0) ? 2 : map(chanCount[ch], 0, maxC, 2, graphH - 10);
    int x = (ch - 1) * colW;
    uint16_t color = (ch == bestChan) ? TFT_GREEN : TFT_CYAN;
    tft.fillRect(x + 2, graphY + graphH - barH - 10, colW - 4, barH, color);
    tft.setCursor(x + 4, graphY + graphH - 8);
    tft.print(ch);
  }

  // рекомендация
  tft.fillRect(0, 100, 240, 14, TFT_BLACK);
  tft.setCursor(5, 100);
  tft.setTextColor(TFT_GREEN, TFT_BLACK);
  tft.printf("Best channel: %d", bestChan);
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.setCursor(5, 115);
  tft.println("BTN1: rescan  BTN2: menu");

  WiFi.scanDelete();
}

// ================= Port Scanner (на шлюзе) =================
void startPortScan() {
  if (WiFi.status() != WL_CONNECTED) {
    tft.fillScreen(TFT_BLACK);
    tft.setTextSize(1);
    tft.setCursor(5, 5);
    drawBatteryIcon();
    tft.setTextColor(TFT_RED, TFT_BLACK);
    tft.println("WiFi not connected");
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    tft.setCursor(5, 115);
    tft.println("BTN2: menu");
    return;
  }

  portsOpenCount = 0;
  portScanIndex = 0;
  portScanRunning = true;

  tft.fillScreen(TFT_BLACK);
  tft.setTextSize(1);
  tft.setCursor(5, 0);
  drawBatteryIcon();
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.printf("Port Scan: %s", WiFi.gatewayIP().toString().c_str());
  tft.drawLine(0, 12, 240, 12, TFT_DARKGREY);
  tft.setCursor(5, 115);
  tft.println("Scanning...  BTN2: cancel");
}

void doPortScanStep() {
  if (portScanIndex >= scanPortCount) {
    portScanRunning = false;
    tft.fillRect(0, 100, 240, 14, TFT_BLACK);
    tft.setCursor(5, 100);
    tft.setTextColor(TFT_GREEN, TFT_BLACK);
    tft.printf("Done. %d open ports", portsOpenCount);
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
    tft.setCursor(5, 115);
    tft.println("BTN1: rescan  BTN2: menu");
    return;
  }

  uint16_t port = scanPorts[portScanIndex];
  uint32_t ms = 0;
  bool open = tcpPing(WiFi.gatewayIP(), port, SCAN_TIMEOUT_MS, ms);

  if (open && portsOpenCount < 7) {
    int y = 16 + portsOpenCount * 13;
    tft.setCursor(20, y);
    tft.setTextColor(TFT_GREEN, TFT_BLACK);
    tft.printf("%-5d open  (%lums)", port, ms);
    tft.setTextColor(TFT_WHITE, TFT_BLACK);
  }
  if (open) portsOpen[portsOpenCount++] = port;

  // прогресс
  int barW = map(portScanIndex, 0, scanPortCount, 0, 240);
  tft.fillRect(0, 96, barW, 3, TFT_BLUE);

  portScanIndex++;
}
